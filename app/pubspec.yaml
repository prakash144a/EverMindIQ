name: voiceiq
description: "VoiceIQ — capture life moments by voice and talk to an AI that remembers."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  record: ^5.1.0
  path_provider: ^2.1.3
  audioplayers: ^6.0.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# record 5.2.1 pins record_linux to the old 0.7.x line, but record_platform_interface
# floats to 1.6.0 (which added a `request` named arg to hasPermission). record_linux
# 0.7.2 never implemented it, so the build fails even on Android (Flutter compiles the
# whole plugin graph). Bump record_linux to 1.3.1, which targets interface ^1.5.0 and
# implements the newer signature; this aligns it with record_android 1.5.2 (also ^1.5.0).
dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
