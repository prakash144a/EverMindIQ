name: voiceiq
description: "VoiceIQ — capture life moments by voice and talk to an AI that remembers."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  record: ^5.1.0
  path_provider: ^2.1.3
  audioplayers: ^6.0.0
  intl: ^0.19.0
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
