name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Test (mock mode)
        env:
          VOICEIQ_MOCK: "1"
        run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npx vite build
      # `site/` has no job: it is hand-written static HTML with no build step and
      # nothing to test. It is deployed straight from the repo.

  # Build the backend image, deploy Cloud Run, and push Firestore rules/indexes.
  # Runs only on main once deployment is configured. To enable:
  #   1. Provision infra (see infra/README.md) so the Artifact Registry repo,
  #      Cloud Run service, and backend SA exist.
  #   2. Set up Workload Identity Federation and grant the deploy SA the roles
  #      run.admin, artifactregistry.writer, cloudbuild.builds.editor,
  #      datastore.owner (for rules), and iam.serviceAccountUser on the backend SA.
  #   3. Add repo variables: DEPLOY_ENABLED=true, GCP_PROJECT_ID, GCP_REGION.
  #   4. Add repo secrets: GCP_WIF_PROVIDER, GCP_DEPLOY_SA.
  deploy:
    needs: [backend, app, admin]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push backend image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/voiceiq/api:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit backend --tag "$IMAGE" --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy voiceiq-api \
            --image "$IMAGE" \
            --region "$REGION" \
            --quiet

      # The console is a static bundle; it holds no secrets, and every
      # authorization decision is made server-side by the admin allowlist.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build the admin console
        working-directory: admin
        env:
          VITE_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
        run: |
          npm ci
          npx vite build

      - name: Deploy Firestore rules, indexes & hosting
        run: |
          npm install -g firebase-tools
          firebase deploy \
            --only firestore:rules,firestore:indexes,hosting \
            --project "$PROJECT" \
            --non-interactive
