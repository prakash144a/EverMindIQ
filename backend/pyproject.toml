[project]
name = "voiceiq-backend"
version = "0.1.0"
description = "VoiceIQ backend: API, ingestion, RAG, and Gemini Live proxy."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Real GCP/Gemini integrations. Not required for mock mode / tests.
gcp = [
    "firebase-admin>=6.5",
    "google-cloud-storage>=2.16",
    "google-cloud-firestore>=2.16",
    "google-cloud-pubsub>=2.21",
    "google-genai>=0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # Pinned to a minor line. Unpinned, CI resolved whatever was newest and a
    # new release could turn the build red without a code change — which is
    # exactly what happened: every CI run failed from the first commit onward.
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Chosen explicitly rather than inherited, so a ruff upgrade cannot silently
# add rules and fail the build. Pyflakes, pycodestyle, and import order — the
# errors that indicate a real mistake.
select = ["E", "W", "F", "I"]
# Deliberately NOT enabled:
#   B008  flags `Depends(...)` in a parameter default, which is the documented
#         FastAPI idiom and is used by every route in this codebase.
#   UP017 prefers `datetime.UTC` over `timezone.utc`; the codebase is
#         consistently the latter and the two are identical at runtime.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
